spring.application.name=myfirstspringproject


spring.datasource.url = jdbc:mysql://localhost:3306/student_tracker
spring.datasource.username = springstudent
spring.datasource.password = springstudent

spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


#turn off the banner of the spring
spring.main.banner-mode = off

#Reduce the warning lavel of the spring boot then turn off the file
logging.level.root = warn

#adding logging config to display sql statements
logging.level.org.hibernate.SQL = debug
logging.level.org.hibernate.orm.jdbc.bind = trace

#configure JPA/Hibernate to auto create a table
spring.jpa.hibernate.ddl-auto=update

